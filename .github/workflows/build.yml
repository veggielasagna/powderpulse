name: Build Powder Pulse

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Pick the newest Windows SDK
        id: sdk
        shell: pwsh
        run: |
          $root = "C:\Program Files (x86)\Windows Kits\10\Platforms\UAP"
          $sdks = Get-ChildItem $root -Directory | Where-Object { $_.Name -match '^10\.0\.\d+\.\d+$' } | Sort-Object { [version]$_.Name } -Descending
          if (-not $sdks) { throw "No UWP SDK found on this runner" }
          $v = $sdks[0].Name
          Write-Host "Using Windows SDK $v"
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Bundle the 3D library with the game
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js" -OutFile "PowderPulse\web\three.min.js"
          $size = (Get-Item "PowderPulse\web\three.min.js").Length
          if ($size -lt 500000) { throw "three.min.js looks wrong ($size bytes)" }
          Write-Host "three.min.js $size bytes"

      - name: Bundle the font so the game looks right offline
        shell: pwsh
        run: |
          try {
            $ua = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36"
            $css = (Invoke-WebRequest -UseBasicParsing -UserAgent $ua -Uri "https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600&display=swap").Content
            New-Item -ItemType Directory -Force -Path "PowderPulse\web\fonts" | Out-Null
            $i = 0
            foreach ($m in [regex]::Matches($css, 'url\((https://[^)]+?\.woff2)\)')) {
              $u = $m.Groups[1].Value; $name = "chakra-$i.woff2"
              Invoke-WebRequest -UseBasicParsing -Uri $u -OutFile "PowderPulse\web\fonts\$name"
              $css = $css.Replace($u, "fonts/$name"); $i++
            }
            if ($i -eq 0) { throw "no font files in the stylesheet" }
            Set-Content -Path "PowderPulse\web\fonts.css" -Value $css -Encoding utf8
            $page = Get-Content "PowderPulse\web\index.html" -Raw
            $page = $page -replace '<link rel="preconnect" href="https://fonts.googleapis.com">\s*', ''
            $page = $page -replace '<link rel="stylesheet" href="https://fonts.googleapis.com/css2[^"]*">', '<link rel="stylesheet" href="fonts.css">'
            Set-Content -Path "PowderPulse\web\index.html" -Value $page -Encoding utf8 -NoNewline
            Write-Host "Bundled $i font files"
          } catch {
            Write-Host "Couldn't bundle the font ($_); the game will load it online instead"
          }

      - name: Stamp the version number
        shell: pwsh
        run: |
          $version = "1.0.${{ github.run_number }}.0"
          $manifest = "PowderPulse\Package.appxmanifest"
          (Get-Content $manifest -Raw) -replace 'Version="1\.0\.0\.0"', "Version=""$version""" | Set-Content $manifest -Encoding utf8
          "APP_VERSION=$version" >> $env:GITHUB_ENV
          Write-Host "Version $version"

      - name: Create a signing certificate
        shell: pwsh
        run: |
          $cert = New-SelfSignedCertificate -Type Custom -Subject "CN=PowderPulse" -KeyUsage DigitalSignature -FriendlyName "Powder Pulse" `
            -CertStoreLocation "Cert:\CurrentUser\My" `
            -TextExtension @("2.5.29.37={text}1.3.6.1.5.5.7.3.3", "2.5.29.19={text}")
          $password = ConvertTo-SecureString -String "powderpulse" -Force -AsPlainText
          Export-PfxCertificate -Cert $cert -FilePath "PowderPulse\PowderPulse_Signing.pfx" -Password $password | Out-Null
          Write-Host "Certificate $($cert.Thumbprint)"

      - name: Restore packages
        run: msbuild PowderPulse.sln -t:Restore -p:Configuration=Release -p:Platform=x64 -p:TargetPlatformVersion=${{ steps.sdk.outputs.version }}

      - name: Build the app package
        run: >
          msbuild PowderPulse\PowderPulse.csproj
          -p:Configuration=Release
          -p:Platform=x64
          -p:TargetPlatformVersion=${{ steps.sdk.outputs.version }}
          -p:AppxBundle=Never
          -p:UapAppxPackageBuildMode=SideloadOnly
          -p:GenerateAppxPackageOnBuild=true
          -p:AppxPackageDir=${{ github.workspace }}\out\
          -p:AppxPackageSigningEnabled=true
          -p:PackageCertificateKeyFile=PowderPulse_Signing.pfx
          -p:PackageCertificatePassword=powderpulse
          -verbosity:minimal

      - name: Gather the files to install
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path install | Out-Null
          $pkg = Get-ChildItem out -Recurse -Include *.msix, *.appx | Where-Object { $_.FullName -notmatch '\\Dependencies\\' } | Select-Object -First 1
          if (-not $pkg) { Get-ChildItem out -Recurse | Format-Table FullName; throw "No app package was produced" }
          Copy-Item $pkg.FullName install\
          Get-ChildItem out -Recurse -Include *.appx, *.msix | Where-Object { $_.FullName -match '\\Dependencies\\x64\\' -and $_.Name -notmatch 'Desktop' } | ForEach-Object { Copy-Item $_.FullName install\ }
          @"
          Powder Pulse $env:APP_VERSION

          Install on your Xbox (Dev Mode):
          1. On a computer, open the Xbox Device Portal (the https://<xbox-ip>:11443 address shown in Dev Home).
          2. On the Home page, choose Add.
          3. Pick $($pkg.Name) as the app package and choose Next.
          4. Tick "I want to specify optional packages", add every .appx file in this folder one at a time, and choose Start.
          5. In Dev Home, highlight Powder Pulse, press the View button, choose View details, and set App type to Game.
             Games get the full memory and graphics budget and keep running when you open the guide.

          To update later, install the newer package the same way.
          "@ | Set-Content install\HOW-TO-INSTALL.txt
          Get-ChildItem install | Format-Table Name, Length

      - name: Upload the install files
        uses: actions/upload-artifact@v4
        with:
          name: Powder-Pulse-${{ env.APP_VERSION }}-install
          path: install/
          if-no-files-found: error

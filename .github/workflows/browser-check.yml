name: Browser check

# Runs the game in a real browser (headless Chromium, real three.js) and presses every mode.
# Screenshots are pushed to the ci-shots branch so they can be looked at without downloading artifacts.
on:
  push:
    branches: [ main ]
    paths: [ 'PowderPulse/web/**', 'tests/**', '.github/workflows/browser-check.yml' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Get three.js and Playwright
        run: |
          curl -sSfL https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js -o PowderPulse/web/three.min.js
          npm init -y > /dev/null
          npm install playwright@1.47.2 > /dev/null
          npx playwright install --with-deps chromium > /dev/null

      - name: Run the game in a browser
        run: |
          (cd PowderPulse/web && python3 -m http.server 8000 > /dev/null 2>&1 &)
          sleep 2
          node tests/browser-check.mjs | tee tests/shots-report.txt

      - name: Publish screenshots to the ci-shots branch
        if: always()
        run: |
          mkdir -p /tmp/shots && cp tests/shots/*.png tests/shots-report.txt /tmp/shots/ 2>/dev/null || true
          cd /tmp/shots
          git init -q && git checkout -q -b ci-shots
          git config user.name "ci" && git config user.email "ci@users.noreply.github.com"
          git add -A && git commit -qm "Browser check ${{ github.sha }}" || exit 0
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" ci-shots
